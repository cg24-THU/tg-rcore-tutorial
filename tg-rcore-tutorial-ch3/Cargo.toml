[package]
name = "cg-tg-rcore-tutorial-ch3"
description = "A reproducible learning crate for rCore Tutorial chapter 3, covering multiprogramming, cooperative/preemptive scheduling, clock_gettime, and trace on RISC-V."
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chaoge <2024010843@secoder.net>"]
repository = "https://github.com/cg24-THU/tg-rcore-tutorial"
homepage = "https://github.com/cg24-THU/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-ch3"
documentation = "https://docs.rs/cg-tg-rcore-tutorial-ch3"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
include = [
    ".cargo/config.toml",
    "Cargo.toml",
    "LICENSE",
    "Makefile",
    "README.md",
    "build.rs",
    "exercise.md",
    "report.md",
    "rust-toolchain.toml",
    "test.sh",
    "src/**",
]

[features]
coop = []
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
riscv = "0.10.1"

tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-rcore-tutorial-sbi", version = "=0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "=0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "=0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-rcore-tutorial-kernel-context", version = "=0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", path = "../tg-rcore-tutorial-syscall", version = "=0.4.8", features = ["kernel"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "=0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
