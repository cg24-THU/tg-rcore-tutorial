[package]
name = "cg-tg-rcore-tutorial-t3l8"
description = "A reproducible Rust learning crate for the tg-rcore-tutorial chapter 8 kernel experiment, including threading, synchronization, framebuffer I/O, and a user-mode Doom demo path."
version = "0.0.0"
edition = "2024"
authors = ["YdrMaster <ydrml@hotmail.com>", "Yifan Wang <w-yf22@mails.tsinghua.edu.cn>", "Yu Chen <yuchen@tsinghua.edu.cn>"]
rust-version = "1.85"
repository = "https://github.com/cg24-THU/tg-rcore-tutorial"
homepage = "https://github.com/cg24-THU/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-ch8"
documentation = "https://docs.rs/cg-tg-rcore-tutorial-t3l8"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
include = [
    ".cargo/config.toml",
    "Cargo.toml",
    "LICENSE",
    "Makefile",
    "README.md",
    "build.rs",
    "docs/**",
    "exercise.md",
    "report.md",
    "rust-toolchain.toml",
    "src/**",
    "test.sh",
    "tg-rcore-tutorial-console/**",
    "tg-rcore-tutorial-signal-defs/**",
    "tg-rcore-tutorial-syscall/**",
    "tg-user/**",
]

[features]
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
virtio-drivers = "0.1.0"
xmas-elf = "0.8.0"
riscv = "0.10.1"
spin = "0.9"

tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-rcore-tutorial-sbi", version = "0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-rcore-tutorial-kernel-context", version = "0.4.8", features = ["foreign"] }
tg-kernel-alloc = { package = "tg-rcore-tutorial-kernel-alloc", path = "../tg-rcore-tutorial-kernel-alloc", version = "0.4.8" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", path = "../tg-rcore-tutorial-kernel-vm", version = "0.4.8" }
tg-syscall = { package = "cg-tg-rcore-tutorial-t3l8-syscall", path = "../cg-tg-rcore-tutorial-t3l8-syscall", version = "0.0.0", features = ["kernel"] }
tg-task-manage = { package = "tg-rcore-tutorial-task-manage", path = "../tg-rcore-tutorial-task-manage", version = "0.4.8", features = ["thread"] }
tg-easy-fs = { package = "cg-tg-rcore-tutorial-t3l8-easy-fs", path = "../cg-tg-rcore-tutorial-t3l8-easy-fs", version = "0.0.0" }
tg-signal = { package = "tg-rcore-tutorial-signal", path = "../tg-rcore-tutorial-signal", version = "0.4.8" }
tg-signal-impl = { package = "tg-rcore-tutorial-signal-impl", path = "../tg-rcore-tutorial-signal-impl", version = "0.4.8" }
tg-sync = { package = "tg-rcore-tutorial-sync", path = "../tg-rcore-tutorial-sync", version = "0.4.8" }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
tg-easy-fs = { package = "cg-tg-rcore-tutorial-t3l8-easy-fs", path = "../cg-tg-rcore-tutorial-t3l8-easy-fs", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
